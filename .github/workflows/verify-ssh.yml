name: Verify VPS SSH Connection

# Run this manually to test if SSH secrets are correctly configured
# before relying on the main deploy workflow.
on:
  workflow_dispatch:

jobs:
  verify:
    name: Test SSH Connection
    runs-on: ubuntu-latest
    steps:
      - name: Check secrets exist
        run: |
          echo "Checking secrets..."
          [ -z "${{ secrets.VPS_HOST }}" ]         && echo "❌ VPS_HOST is MISSING"         || echo "✓ VPS_HOST is set ($(echo '${{ secrets.VPS_HOST }}' | wc -c) chars)"
          [ -z "${{ secrets.VPS_USER }}" ]         && echo "❌ VPS_USER is MISSING"         || echo "✓ VPS_USER is set"
          [ -z "${{ secrets.VPS_SSH_PRIVATE_KEY }}" ] && echo "❌ VPS_SSH_PRIVATE_KEY is MISSING" || echo "✓ VPS_SSH_PRIVATE_KEY is set ($(echo '${{ secrets.VPS_SSH_PRIVATE_KEY }}' | wc -c) chars)"

      - name: Test SSH connection
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          command_timeout: 30s
          script: |
            echo "✓ SSH connection successful"
            echo "  Host: $(hostname)"
            echo "  User: $(whoami)"
            echo "  Dir:  $(pwd)"
            echo "  Repo: $(cd /opt/swrap && git log --oneline -1 2>/dev/null || echo 'NOT FOUND')"
            echo "  API:  $(curl -sf http://localhost:4000/health 2>/dev/null || echo 'UNREACHABLE')"
