name: Deploy API to VPS

on:
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'packages/**'
      - 'db/**'
      - 'prisma/**'
      - 'docker-compose.vps.yml'
      - 'apps/api/Dockerfile'

  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 168.144.95.178
          username: root
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          script: |
            cd /opt/swrap
            git pull origin main
            docker compose -f docker-compose.vps.yml --env-file .env.deploy up -d --build --remove-orphans
            docker compose -f docker-compose.vps.yml --env-file .env.deploy exec -T api npx node-pg-migrate up --migrations-dir db/migrations --database-url-var DATABASE_URL || true
            sleep 5
            curl -sf http://localhost:4000/health || echo "WARNING: Health check failed"
