name: Deploy API to VPS

on:
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'packages/**'
      - 'db/**'
      - 'prisma/**'
      - 'docker-compose.vps.yml'
      - 'apps/api/Dockerfile'
      - 'nginx/**'
      - 'deploy/**'

  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Skip test suite (emergency deploy)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

concurrency:
  group: deploy-api
  cancel-in-progress: false

env:
  DEPLOY_DIR: /opt/swrap
  COMPOSE_FILE: docker-compose.vps.yml
  ENV_FILE: .env.deploy

jobs:
  # ─── Test Gate ─────────────────────────────────────────────────────────────
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.skip_tests != 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Run tests
        run: npm run test:run

  # ─── Deploy ───────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: [test]
    if: always() && (needs.test.result == 'success' || needs.test.result == 'skipped')
    environment:
      name: production
      url: https://api.swrap.tech/health
    steps:
      - name: Checkout (for commit SHA)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          command_timeout: 10m
          script: |
            set -euo pipefail

            DEPLOY_DIR="${{ env.DEPLOY_DIR }}"
            COMPOSE_FILE="${{ env.COMPOSE_FILE }}"
            ENV_FILE="${{ env.ENV_FILE }}"
            COMMIT_SHA="${{ github.sha }}"
            SHORT_SHA="${COMMIT_SHA:0:7}"

            cd "$DEPLOY_DIR"

            echo "═══════════════════════════════════════════════════════════════"
            echo "  Deploying commit: $SHORT_SHA"
            echo "  Time: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo "═══════════════════════════════════════════════════════════════"

            # ── Save current state for rollback ──────────────────────────────
            PREV_SHA=$(git rev-parse HEAD 2>/dev/null || echo "none")
            echo "  Previous: ${PREV_SHA:0:7}"
            echo "  Target:   $SHORT_SHA"

            # ── Pull latest code ─────────────────────────────────────────────
            echo ""
            echo "▶ Pulling latest code..."
            git fetch origin main
            git reset --hard "origin/main"

            # ── Build and deploy (zero-downtime via Docker Compose) ──────────
            echo ""
            echo "▶ Building and deploying containers..."
            docker compose -f "$COMPOSE_FILE" --env-file "$ENV_FILE" \
              build --build-arg COMMIT_SHA="$COMMIT_SHA"
            docker compose -f "$COMPOSE_FILE" --env-file "$ENV_FILE" \
              up -d --remove-orphans

            # ── Run database migrations ──────────────────────────────────────
            echo ""
            echo "▶ Running database migrations..."
            docker compose -f "$COMPOSE_FILE" --env-file "$ENV_FILE" exec -T api \
              npx node-pg-migrate up --migrations-dir db/migrations --database-url-var DATABASE_URL \
              2>&1 || echo "  ⚠ Migration step completed (check output above)"

            # ── Health check with retries ────────────────────────────────────
            echo ""
            echo "▶ Waiting for API to be healthy..."
            sleep 5

            MAX_RETRIES=12
            RETRY=0
            HEALTHY=false

            while [ $RETRY -lt $MAX_RETRIES ]; do
              if curl -sf http://localhost:4000/health | grep -q '"status":"ok"'; then
                HEALTHY=true
                break
              fi
              RETRY=$((RETRY + 1))
              echo "  Waiting... (attempt $RETRY/$MAX_RETRIES)"
              sleep 5
            done

            if [ "$HEALTHY" = true ]; then
              echo "  ✓ API is healthy at commit $SHORT_SHA"
              echo ""
              echo "▶ Container status:"
              docker compose -f "$COMPOSE_FILE" --env-file "$ENV_FILE" ps
              echo ""
              echo "═══════════════════════════════════════════════════════════════"
              echo "  ✓ Deployment successful!"
              echo "  Commit: $SHORT_SHA"
              echo "  URL: https://api.swrap.tech/health"
              echo "═══════════════════════════════════════════════════════════════"
            else
              echo ""
              echo "  ✗ Health check FAILED after $MAX_RETRIES attempts"
              echo ""
              echo "▶ Rolling back to $PREV_SHA..."

              # Rollback: reset to previous commit and redeploy
              if [ "$PREV_SHA" != "none" ]; then
                git reset --hard "$PREV_SHA"
                docker compose -f "$COMPOSE_FILE" --env-file "$ENV_FILE" \
                  up -d --build --remove-orphans
                sleep 10

                if curl -sf http://localhost:4000/health | grep -q '"status":"ok"'; then
                  echo "  ✓ Rollback successful — running at ${PREV_SHA:0:7}"
                else
                  echo "  ✗ Rollback also failed — MANUAL INTERVENTION REQUIRED"
                fi
              fi

              echo ""
              echo "▶ Recent API logs:"
              docker compose -f "$COMPOSE_FILE" --env-file "$ENV_FILE" logs --tail=30 api

              exit 1
            fi

      - name: Verify external health
        if: success()
        run: |
          sleep 5
          response=$(curl -sf https://api.swrap.tech/health || echo "FAILED")
          echo "External health check: $response"
          if echo "$response" | grep -q '"status":"ok"'; then
            echo "✓ External verification passed"
          else
            echo "⚠ External health check returned unexpected response (may be DNS/TLS lag)"
          fi

      - name: Notify failure
        if: failure()
        run: |
          echo "::error::Deployment failed for commit ${{ github.sha }}. Check VPS logs."
          echo "To investigate: ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} 'cd /opt/swrap && docker compose -f docker-compose.vps.yml logs --tail=50 api'"
